[project]
name = "air-traffic-platform"
version = "0.1.0"
description = "Air Traffic Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "polars>=0.20.31",
    "duckdb>=1.0.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "rich>=13.7.1",
    "requests>=2.32.3",
    "faker>=25.8.0",
    "holidays>=0.51",
    "python-dotenv>=1.0.1",
    "pyarrow>=16.1.0",
    "pandas==2.2.3",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
etl = [
    "pyopensky>=2.16",
    "opensky-api",
    "traffic>=2.13",
]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "dbt-duckdb>=1.8.0",
    "httpx>=0.27.0",
]

[project.scripts]
air-traffic-orchestrate = "pipelines.orchestrator:main"
air-traffic-api = "apps.main:entrypoint"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: long-running end-to-end tests",
]
addopts = "--cov=apps --cov=config --cov=ingestion --cov=pipelines --cov=scripts --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true
source = ["apps", "config", "ingestion", "pipelines", "scripts"]
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
show_missing = true

[tool.uv]
package = true

[tool.uv.sources]
opensky-api = { git = "https://github.com/openskynetwork/opensky-api.git", subdirectory = "python" }

[tool.setuptools.packages.find]
include = ["apps*", "config*", "ingestion*", "pipelines*", "scripts*"]
