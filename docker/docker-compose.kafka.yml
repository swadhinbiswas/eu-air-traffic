# Local single-node Kafka (Redpanda) for developing the worker → Kafka →
# consumer → raw/Bronze spine without an Aiven account.
#
#   docker compose -f docker/docker-compose.kafka.yml up -d
#   export AIVEN_KAFKA_HOST=127.0.0.1 AIVEN_KAFKA_PORT=19092
#   export KAFKA_SECURITY_PROTOCOL=PLAINTEXT
#
# Redpanda is Kafka-API compatible, so the same producer/consumer code works
# against Aiven in production and this broker locally.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: eu-air-traffic-kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://127.0.0.1:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
