name: Frontend (runtime data)

# The dashboard fetches its data at runtime (warehouse API on MotherDuck + the
# collector's live feed), so there is no static data bundle to generate. This
# job only builds and publishes the React app.
# Runs on every push to main alongside the lake pipeline, plus nightly so the
# deployed bundle always reflects the current secrets/variables.
on:
  schedule:
    - cron: "30 3 * * *" # nightly rebuild
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend
  cancel-in-progress: true

jobs:
  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & build
        working-directory: web
        env:
          # Where the deployed site reads data at runtime.
          VITE_LIVE_URL: ${{ vars.VITE_LIVE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Gold analytics are read straight from Turso in the browser.
          # VITE_TURSO_TOKEN MUST be a read-only Turso token — it is inlined
          # into the JS bundle and visible to anyone.
          VITE_TURSO_URL: ${{ secrets.TURSO_DATABASE_URL }}
          VITE_TURSO_TOKEN: ${{ secrets.VITE_TURSO_TOKEN }}
        run: npm ci && npm run build

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dashboard
          path: web/dist
          if-no-files-found: error
