name: Lake (Kafka → Silver → Gold)

# The VPS collector publishes to Kafka 24/7. Every 9 minutes — and on every push
# to main — this job drains the records accumulated since the previous run
# (Kafka consumer offset, not a query time-window), builds Silver, then dbt Gold
# → MotherDuck → Turso.
on:
  schedule:
    - cron: "*/9 * * * *" # every 9 minutes
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lake
  cancel-in-progress: false # never overlap: one consumer group, one DuckDB writer

# Needed so the failure job can open an issue.
permissions:
  contents: read
  issues: write

jobs:
  lake:
    name: Drain Kafka → Bronze → Silver → Gold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIVEN_KAFKA_HOST: ${{ secrets.AIVEN_KAFKA_HOST }}
      AIVEN_KAFKA_PORT: ${{ secrets.AIVEN_KAFKA_PORT }}
      AIVEN_KAFKA_USERNAME: ${{ secrets.AIVEN_KAFKA_USERNAME }}
      AIVEN_KAFKA_PASSWORD: ${{ secrets.AIVEN_KAFKA_PASSWORD }}
      KAFKA_SECURITY_PROTOCOL: ${{ vars.KAFKA_SECURITY_PROTOCOL || 'SASL_SSL' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: ${{ vars.HF_REPO || secrets.HF_REPO }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      MOTHERDUCK_DATABASE: ${{ vars.MOTHERDUCK_DATABASE || 'my_db' }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      WAREHOUSE_TARGET: local
      DBT_TARGET: dev
      # Absolute path: dbt resolves relative paths from the process cwd, which is
      # the repo root here, not the project dir.
      AIR_TRAFFIC_DUCKDB_PATH: ${{ github.workspace }}/warehouse/air_traffic.duckdb
      # Follow the log for at most 7 minutes; the next job starts at 9.
      LAKE_WINDOW_SECONDS: "420"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev --extra stream --extra turso

      - name: Materialise the Kafka CA certificate
        # The PEM lives in a secret as text; the client expects a file path.
        env:
          CA_PEM: ${{ secrets.AIVEN_KAFKA_CA_PEM }}
        run: |
          if [ -n "$CA_PEM" ]; then
            printf '%s\n' "$CA_PEM" > "$RUNNER_TEMP/aiven-ca.pem"
            echo "AIVEN_KAFKA_CA_CERT=$RUNNER_TEMP/aiven-ca.pem" >> "$GITHUB_ENV"
            echo "CA certificate written."
          else
            echo "No CA certificate secret set — using the system trust store."
          fi

      - name: Pull existing Silver from Hugging Face
        # Incremental Silver appends to the previous layer, so it must be
        # present: a failed pull followed by a push would truncate the lake.
        run: uv run python -m scripts.lake_sync pull-silver

      - name: Sink Kafka → Bronze Parquet
        # Exits non-zero when the broker is unreachable or nothing is drained,
        # which is a real failure, not a quiet window.
        run: uv run python -m services.sink --window-seconds 420

      - name: Silver transform (incremental)
        run: uv run python -m pipelines.silver

      - name: Publish Silver to Hugging Face
        run: uv run python -m scripts.lake_sync push-silver

      - name: Build DuckDB star schema
        run: uv run python -m pipelines.warehouse

      - name: dbt build (Gold models + tests)
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Register gold_* views
        run: uv run python -m pipelines.warehouse --register-gold

      - name: Publish Gold to MotherDuck
        run: uv run python -m scripts.publish_motherduck

      - name: Quality report (Ops page source)
        run: uv run python -m pipelines.quality

      - name: Publish site tables (stories, ops, lineage) to MotherDuck
        run: uv run python -m scripts.publish_site_tables

      - name: Publish serving copy to Turso (the site reads this)
        run: uv run python -m scripts.publish_turso

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lake-quality-report
          path: warehouse/checkpoints/quality_report.json
          if-no-files-found: ignore

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: lake
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 Lake pipeline failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing: ${run} (${new Date().toISOString()})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title,
                body: `The Kafka → Silver → Gold job failed. See ${run}.`,
              });
            }
