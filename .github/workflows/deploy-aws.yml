name: Deploy (AWS)

# Provisions the AWS reference stack with Terraform and (optionally) ships both
# container images.
#
# Manual-only on purpose. The AWS stack is a reference implementation and is not
# deployed by this repository, so this workflow must never run on push — doing so
# just tries to assume an IAM role that does not exist and fails. Run it by hand
# from the Actions tab only after you have provisioned the OIDC role and set the
# repository variables below.
#
# Required repository variables (Settings -> Secrets and variables -> Actions):
#   AWS_DEPLOY_ROLE_ARN   IAM role GitHub assumes via OIDC (see infra/terraform/iam.tf)
#   AWS_REGION            e.g. eu-central-1
#   TF_STATE_BUCKET       optional; S3 bucket for shared Terraform state
#
# Authentication is keyless: no long-lived AWS access key is stored here.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (otherwise plan only)"
        type: boolean
        default: false
      build_images:
        description: "Build and push the container images to ECR"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for the OIDC token exchange

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_IN_AUTOMATION: "true"

jobs:
  preflight:
    name: Check AWS configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        # Fail closed: if the deploy role is not configured, skip the rest with a
        # clear notice instead of erroring on a missing credential.
        run: |
          if [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=AWS deploy skipped::Set the AWS_DEPLOY_ROLE_ARN repository variable (and TF_STATE_BUCKET) to enable this workflow. The AWS stack is a reference implementation and is not deployed by default."
          fi

  terraform:
    name: Terraform plan / apply
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    environment: ${{ inputs.apply && 'production' || '' }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.1"

      - name: Configure remote state
        # Shared S3 state so a plan/apply is not lost between runners. Skip when
        # TF_STATE_BUCKET is unset (local state, suitable only for a scratch run).
        if: vars.TF_STATE_BUCKET != ''
        run: |
          cat > backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "${{ vars.TF_STATE_BUCKET }}"
              key          = "eu-air-traffic/terraform.tfstate"
              region       = "${{ env.AWS_REGION }}"
              encrypt      = true
              use_lockfile = true
            }
          }
          EOF

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: inputs.apply
        run: terraform apply -input=false -auto-approve tfplan

  images:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [preflight, terraform]
    if: needs.preflight.outputs.configured == 'true' && inputs.build_images && !failure()
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the collector
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.collector
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/eu-air-traffic/collector:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/eu-air-traffic/collector:latest
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/eu-air-traffic/collector:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/eu-air-traffic/collector:buildcache,mode=max

      - name: Build and push the lake job
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/lake-job.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/eu-air-traffic/lake-job:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/eu-air-traffic/lake-job:latest

      - name: Roll the collector service
        run: |
          aws ecs update-service \
            --cluster eu-air-traffic \
            --service eu-air-traffic-collector \
            --force-new-deployment
