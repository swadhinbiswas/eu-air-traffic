name: ETL

# Scheduled data refresh every 6 hours, plus manual dispatch.
on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipelines/**"
      - "ingestion/**"
      - "config/**"

concurrency:
  group: etl
  cancel-in-progress: false  # never run two ETL jobs concurrently (DuckDB is single-writer)

jobs:
  etl:
    name: Run Medallion pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # Set the repo variable MOCK_MODE=false once real API secrets are configured.
      MOCK_MODE: ${{ vars.MOCK_MODE || 'true' }}
      AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      AIRPORTDB_API_TOKEN: ${{ secrets.AIRPORTDB_API_TOKEN }}
      OPENSKY_USERNAME: ${{ secrets.OPENSKY_USERNAME }}
      OPENSKY_PASSWORD: ${{ secrets.OPENSKY_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: ${{ secrets.HF_REPO }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pipeline
        run: uv run python -m pipelines.orchestrator

      - name: Generate dashboard HTML
        run: uv run python -m scripts.build_dashboard

      - name: Run dbt models + tests
        working-directory: dbt
        run: uv run dbt build --profiles-dir .

      - name: Upload to Hugging Face Hub
        run: uv run python -m scripts.upload_hf

      - name: Upload pipeline report
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: |
            warehouse/checkpoints/pipeline_report.json
            warehouse/checkpoints/quality_report.json
          if-no-files-found: warn

      - name: Upload warehouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: air-traffic-warehouse
          path: warehouse/air_traffic.duckdb
          if-no-files-found: warn

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-html
          path: warehouse/dashboard.html
          if-no-files-found: warn

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: etl
    if: failure()
    steps:
      - name: Open GitHub issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run || {};
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 ETL pipeline failed — ${new Date().toISOString()}`,
              body: `The scheduled ETL pipeline failed.\n\nSee [the workflow run](${run.html_url || 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions'}).\n\nCheck the pipeline report artifact or run logs for the failing step.`,
            });
