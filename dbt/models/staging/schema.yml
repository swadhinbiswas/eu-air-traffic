version: 2

models:
  - name: stg_fact_flights
    description: "Cleaned and typed flight records with validated timestamps"
    columns:
      - name: flight_id
        description: "Unique flight identifier"
        tests:
          - unique
          - not_null
      - name: callsign
        description: "Flight callsign"
      - name: airline_icao
        description: "ICAO airline code"
        tests:
          - relationships:
              arguments:
                to: ref('stg_dim_airline')
                field: airline_icao
              config:
                severity: warn
      - name: departure_icao
        description: "Departure airport ICAO code (null when only the arrival end is known)"
        tests:
          # OpenSky /flights/all and AirLabs schedules include long-haul
          # endpoints (K/J/O... prefixes) that dim_airport deliberately does
          # not cover. Only European endpoints are expected to resolve —
          # everything else is out of scope, not broken data.
          - relationships:
              arguments:
                to: ref('stg_dim_airport')
                field: airport_icao
              config:
                severity: warn
                where: "left(coalesce(departure_icao, ''), 1) in ('E', 'L', 'B')"
      - name: arrival_icao
        description: "Arrival airport ICAO code (null when only the departure end is known)"
        tests:
          - relationships:
              arguments:
                to: ref('stg_dim_airport')
                field: airport_icao
              config:
                severity: warn
                where: "left(coalesce(arrival_icao, ''), 1) in ('E', 'L', 'B')"

      - name: status
        description: "Flight status"
        tests:
          - accepted_values:
              arguments:
                values: ['landed', 'scheduled', 'cancelled', 'diverted', 'active', 'en-route']
      - name: delay_minutes
        description: "Delay in minutes; NULL when the source has no schedule (OpenSky)"
      - name: cancelled
        description: "Whether the flight was cancelled"

  - name: stg_weather
    description: "Cleaned weather observations"
    columns:
      - name: station_icao
        description: "Weather station ICAO code"
        tests:
          - not_null
      - name: timestamp
        description: "Observation timestamp"
        tests:
          - not_null
      - name: temperature_c
        description: "Temperature in Celsius"
        tests:
          - not_null

  - name: stg_dim_airport
    description: "Cleaned airport dimension"
    columns:
      - name: airport_icao
        description: "ICAO airport code"
        tests:
          - unique
          - not_null
      - name: iata_code
        description: "IATA airport code"
      - name: name
        description: "Airport name"
        tests:
          - not_null

  - name: stg_dim_airline
    description: "Cleaned airline dimension"
    columns:
      - name: airline_icao
        description: "ICAO airline code"
        tests:
          - unique
          - not_null
      - name: airline_name
        description: "Airline name"

  - name: stg_dim_aircraft
    description: "Cleaned aircraft type dimension"
    columns:
      - name: type_icao
        description: "ICAO aircraft type code"
        tests:
          - unique
          - not_null
      - name: manufacturer
        description: "Aircraft manufacturer"
        tests:
          - not_null
      - name: capacity
        description: "Passenger capacity"
        tests:
          - not_null

  - name: stg_dim_route
    description: "Cleaned route dimension"
    columns:
      - name: origin
        description: "Origin airport code"
        tests:
          - not_null
      - name: destination
        description: "Destination airport code"
        tests:
          - not_null
      - name: distance_km
        description: "Route distance in kilometers"

  - name: stg_fact_emissions
    description: "Cleaned aircraft emissions data"
    columns:
      - name: aircraft_type
        description: "Aircraft type code"
        tests:
          - unique
          - not_null
      - name: co2_kg_per_hour
        description: "CO2 emissions per hour in kg"
        tests:
          - not_null
      - name: fuel_burn_liters_per_hour
        description: "Fuel burn rate in liters per hour"

  - name: stg_fact_notams
    description: "Cleaned NOTAM records"
    columns:
      - name: notam_id
        description: "NOTAM identifier"
        tests:
          - unique
          - not_null
      - name: icao_location
        description: "ICAO location code"
        tests:
          - not_null
      - name: notam_type
        description: "Type of NOTAM"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['runway_closure', 'taxiway_closure', 'navaid', 'obstacle',
                         'airport_closure', 'fire', 'bird_activity', 'weather',
                         'airspace', 'other']

  - name: stg_eurostat_airport_traffic
    description: "Eurostat monthly passengers per airport (official benchmark)"
    columns:
      - name: period_start
        tests:
          - not_null
      - name: airport_icao
        tests:
          - not_null
      - name: passengers
        tests:
          - not_null

